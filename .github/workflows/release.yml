name: Release

# Push a tag like v1.0.0 to build the installer and publish it as a GitHub release.
# Installed copies of Carvis find it there and update themselves (Velopack).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (por ejemplo 1.0.1)"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event.inputs.version }}") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/Carvis.App -c Release -r win-x64 -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Previous release (for delta updates)
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      - name: Pack installer
        run: >
          vpk pack --packId CarvisApp --packVersion ${{ steps.version.outputs.value }}
          --packDir publish --mainExe Carvis.exe --packTitle Carvis --packAuthors "Carlos Vidal Marín"
          --icon src/Carvis.App/Assets/carvis.ico -o releases

      - name: Upload to GitHub Releases
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          -o releases --publish --releaseName "Carvis ${{ steps.version.outputs.value }}" --tag v${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: carvis-${{ steps.version.outputs.value }}
          path: releases/*
