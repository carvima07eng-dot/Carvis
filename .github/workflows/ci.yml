name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Tests
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      # An installer to try every version (the real releases come from release.yml).
      - name: Build installer
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          dotnet publish src/Carvis.App -c Release -r win-x64 -o publish
          dotnet tool install -g vpk --version 1.2.161
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          vpk pack --packId CarvisApp --packVersion "$version-ci.${{ github.run_number }}" --packDir publish --mainExe Carvis.exe --packTitle Carvis --packAuthors "Carlos Vidal Marín" --icon src/Carvis.App/Assets/carvis.ico -o installer

      - name: Upload installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: Carvis-Setup
          path: installer/*-Setup.exe
